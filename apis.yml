apis:
- name: Amazon Q Business QApps API
  description: API for Amazon Q Apps, a feature within Amazon Q Business that allows web experience users to create lightweight, purpose-built
    AI apps to fulfill specific tasks using their enterprise data. It supports creating, managing, sharing, and running custom Q Apps through
    a library system.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.aws.amazon.com/amazonq/latest/api-reference/API_Operations_QApps.html
  baseURL: https://qbusiness.{region}.amazonaws.com
  tags:
  - Application
  - Enterprise
  - Generative AI
  - Low-Code
