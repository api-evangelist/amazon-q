name: Amazon Q
description: Amazon Q is a generative AI-powered assistant that helps with various tasks including answering questions, generating content, and
  taking actions based on your enterprise data and systems. It is available in multiple product variants including Amazon Q Business for enterprise
  knowledge, Amazon Q Developer for software development, and Amazon Q in Connect for customer service agents.
