  aid: amazon-q:amazon-q-business-qapps-api
- name: Amazon Q Connect API
  description: API for Amazon Q in Connect, a generative AI-powered customer service assistant integrated with Amazon Connect. It automatically
    detects customer intent during calls and chats using conversational analytics and natural language understanding, then provides contact center
    agents with real-time generative responses, suggested actions, and links to relevant documents.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://aws.amazon.com/connect/q/
  baseURL: https://wisdom.{region}.amazonaws.com
