principles:
  - name: Visibility
    description: Use the AWS Billing console, Cost Explorer with the Amazon Q service filter, and CUR /
      FOCUS export to see per-user, per-application, per-index spend.
  - name: Allocation
    description: Tag Q Business applications and Identity Center groups; map cost-center attributes via
      cost allocation tags so the Q line items roll up to the right team.
  - name: Optimization
    description: Right-size index units (Starter for dev, Enterprise for prod), retire unused user assignments,
      use Lite tier for low-touch users, and watch the 4,000 LOC pooled transformation budget on Q Developer
      Pro.
  - name: Accountability
    description: Set AWS Budgets per Q application/tag and alert on month-over-month seat or index growth;
      review trial overage closely after the 60-day window.
