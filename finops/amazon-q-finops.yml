specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Amazon Q
providerId: amazon-q
publisherName: Amazon Q
serviceCategory: API
created: '2026-05-04'
modified: '2026-05-04'
tags:
  - Artificial Intelligence
  - Assistant
  - AWS
  - Enterprise
  - Generative AI
  - FinOps
  - Cost Management
  - FOCUS
description: FinOps framework definition for the Amazon Q API surface. Provides a FOCUS-aligned mapping
  for cost allocation, usage measurement, and unit-economics reporting across the provider's APIs.
principles:
  - name: Visibility
    description: Make API consumption costs visible to engineering, product, and finance teams in near
      real-time.
  - name: Allocation
    description: Tag every chargeable API call with the consuming team, environment, application, and
      feature so cost can be allocated.
  - name: Optimization
    description: Continuously evaluate request patterns, caching, batching, and tier selection to reduce
      cost per useful unit of work.
  - name: Accountability
    description: Establish budget owners and chargeback or showback flows for each consuming team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Rate Optimization
      - Workload Optimization
      - Cloud Sustainability
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - FinOps Education and Enablement
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Amazon Q
  ServiceCategory: Developer Tools / API
  ProviderName: Amazon Q
  PublisherName: Amazon Q
  InvoiceIssuerName: Amazon Q
  PricingCategory: Usage-Based
  PricingUnit: request
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: api_requests
    description: Count of billable API requests
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - region
      - consumer
  - name: data_egress
    description: Bytes returned over the network in API responses
    unit: GB
    aggregation: sum
    dimensions:
      - api
      - region
      - consumer
  - name: compute_seconds
    description: Server-side compute consumed by the request, where applicable
    unit: second
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
apis:
  - name: Amazon Q Business API
    baseURL: https://qbusiness.{region}.amazonaws.com
    tags:
      - Business Intelligence
      - Enterprise
      - Generative AI
      - Knowledge Management
      - Q&A
    serviceName: Amazon Q Business API
    serviceCategory: API
  - name: Amazon Q Business QApps API
    baseURL: https://qbusiness.{region}.amazonaws.com
    tags:
      - Applications
      - Enterprise
      - Generative AI
      - Low Code
    serviceName: Amazon Q Business QApps API
    serviceCategory: API
  - name: Amazon Q Developer API
    baseURL: https://q.{region}.amazonaws.com
    tags:
      - AI Assistant
      - Code Generation
      - Developer Tools
      - IDE Integration
      - Security Scanning
    serviceName: Amazon Q Developer API
    serviceCategory: API
  - name: Amazon Q Connect API
    baseURL: https://wisdom.{region}.amazonaws.com
    tags:
      - Agent Assistance
      - Contact Center
      - Customer Service
      - Generative AI
      - Real-Time
    serviceName: Amazon Q Connect API
    serviceCategory: API
  - name: Amazon Q Developer in Chat Applications API
    baseURL: https://chatbot.{region}.amazonaws.com
    tags:
      - Chat
      - Developer Tools
      - Integration
      - Messaging
    serviceName: Amazon Q Developer in Chat Applications API
    serviceCategory: API
unitEconomics:
  - name: Cost per 1K Requests
    metric: billed_cost / (api_requests / 1000)
    target: TBD
  - name: Cost per Active Consumer
    metric: billed_cost / active_consumers
    target: TBD
maintainers:
