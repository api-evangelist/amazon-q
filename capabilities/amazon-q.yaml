naftiko: 1.0.0-alpha1
info:
  label: Amazon Q Operations
  description: Workflow capability for Amazon Q. Enables automation of Amazon Q resources for cloud operations teams.
  tags:
  - Amazon Q
  - AWS
  - Cloud Operations
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY: AWS_ACCESS_KEY
    AWS_SECRET_KEY: AWS_SECRET_KEY
capability:
  consumes:
  - import: amazon-q
    location: ./shared/amazon-q.yaml
  exposes:
  - type: rest
    port: 8080
    namespace: amazon-q-api
    description: Unified REST API for Amazon Q operations.
    resources:
    - path: /v1/resources
      name: resources
      description: Amazon Q resources
      operations:
      - method: GET
        name: list-resources
        description: List Amazon Q resources
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: amazon-q-mcp
    transport: http
    description: MCP server for AI-assisted Amazon Q operations.
    tools:
    - name: list-amazon-q-resources
      description: List Amazon Q resources
      hints:
        readOnly: true
      outputParameters:
      - type: object
        mapping: $.
