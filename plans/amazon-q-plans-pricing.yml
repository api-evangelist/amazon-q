specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Amazon Q
providerId: amazon-q
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Amazon
  - AWS
  - GenAI
  - AI Assistant
  - Developer Tools
description: Amazon Q is sold as two product lines. Q Developer is per-user/month with a Free tier (50
  agentic requests) and a Pro tier ($19/user/month). Q Business is per-user/month with Lite ($3) and
  Pro ($20) plans, plus separate Index pricing (per-hour Starter or Enterprise units), media-processing
  surcharges, and consumption-based pricing for anonymous/embedded use cases.
sources:
  - https://aws.amazon.com/q/developer/pricing/
  - https://aws.amazon.com/q/business/pricing/
plans:
  - id: amazon-q-developer-free
    name: Q Developer - Free
    type: freemium
    description: Free tier for individual developers - 50 agentic requests per month, access to latest
      Claude models in IDE and CLI.
    entries:
      - label: Per user
        name: developer_free_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: true
      - label: Agentic requests
        name: developer_free_agentic
        type: quota
        metric: request
        limit: 50
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Latest Claude models
      - name: IDE and CLI integration
      - name: Reference tracking
      - name: Public code suppression
      - name: Q&A in AWS Console
  - id: amazon-q-developer-pro
    name: Q Developer - Pro
    type: subscription
    description: Per-user paid plan with elevated agentic-request limits, code transformation, and admin
      controls.
    entries:
      - label: Per user
        name: developer_pro_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '19.00'
        userMultiplied: true
      - label: Code-transformation overage
        name: developer_pro_overage
        type: metered
        metric: line-of-code
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.003'
        userMultiplied: false
    elements:
      - name: Increased agentic request limits
      - name: 4,000 LOC/month Java + .NET transformation (pooled per account)
      - name: Admin dashboard, user and policy management
      - name: Identity Center support
      - name: IP indemnity
  - id: amazon-q-business-lite
    name: Q Business - Lite
    type: subscription
    description: Per-user plan for question answering and basic permission-aware responses, up to ~1-page
      answers.
    entries:
      - label: Per user
        name: business_lite_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '3.00'
        userMultiplied: true
    elements:
      - name: Permission-aware responses
      - name: Secure enterprise login
      - name: File insights
      - name: Browser extension
  - id: amazon-q-business-pro
    name: Q Business - Pro
    type: subscription
    description: Per-user plan with full capabilities including Q Apps, QuickSight integration, Slack/Outlook/Teams
      integration.
    entries:
      - label: Per user
        name: business_pro_seat
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '20.00'
        userMultiplied: true
    elements:
      - name: Q Apps
      - name: QuickSight integration
      - name: Up to ~7-page responses
      - name: Image processing
      - name: API integrations
      - name: Slack, Outlook, Word, Teams integration
  - id: amazon-q-business-index
    name: Q Business - Index
    type: usage-based
    description: Hourly capacity for indexing connected data sources. Required alongside seat plans.
    entries:
      - label: Starter Index
        name: starter_index
        type: metered
        metric: index-unit-hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.140'
        userMultiplied: false
      - label: Enterprise Index
        name: enterprise_index
        type: metered
        metric: index-unit-hour
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.264'
        userMultiplied: false
      - label: Image processing
        name: media_image
        type: metered
        metric: image
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.003'
        userMultiplied: false
      - label: Audio processing
        name: media_audio
        type: metered
        metric: minute
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.006'
        userMultiplied: false
      - label: Video processing
        name: media_video
        type: metered
        metric: minute
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.050'
        userMultiplied: false
    elements:
      - name: Connected data source indexing
      - name: Multimodal media ingestion
  - id: amazon-q-business-consumption
    name: Q Business - Consumption (anonymous/embedded)
    type: usage-based
    description: Per-unit pricing for anonymous or embedded use cases - 2 units per API call or prompt.
    entries:
      - label: Consumption units
        name: consumption_units
        type: metered
        metric: unit
        limit: -1
        timeFrame: usage
        geo: global
        unit: 30000
        price: '200.00'
        userMultiplied: false
    elements:
      - name: No per-seat fee
      - name: Suited for embedded apps and anonymous endpoints
  - id: amazon-q-business-trial
    name: Q Business - 60-Day Trial
    type: freemium
    description: Free 60-day trial for up to 50 Pro or Lite users plus 1,500 complimentary index hours.
    entries:
      - label: Trial users
        name: trial_users
        type: quota
        metric: seat
        limit: 50
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Trial index hours
        name: trial_index_hours
        type: quota
        metric: index-hour
        limit: 1500
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: One trial application per AWS Payer account
      - name: 60-day evaluation window
maintainers:
  - name: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
  - name: Amazon Web Services
    email: support@aws.amazon.com
    url: https://aws.amazon.com
