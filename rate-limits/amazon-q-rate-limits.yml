specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Amazon Q
providerId: amazon-q
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Rate Limiting
  - AWS
  - GenAI
  - Amazon Q
description: Amazon Q APIs (qbusiness, qdeveloper) follow standard AWS API throttling per account/region.
  Q Business agentic-request quotas and Q Developer agentic-request limits are tracked per user/subscription
  and surface as plan-level quotas rather than per-second throttles. AWS recommends exponential backoff
  with jitter on ThrottlingException.
sources:
  - https://docs.aws.amazon.com/amazonq/latest/api-reference/Welcome.html
  - https://docs.aws.amazon.com/general/latest/gr/api-retries.html
headers:
  requestId: x-amzn-RequestId
  retryAfter: Retry-After
responseCodes:
  throttled: 400
  quotaExceeded: 400
  serviceUnavailable: 503
limits:
  - name: Q Business control-plane API
    scope: account/region
    metric: varies
    limit: see Service Quotas console for Amazon Q Business
    notes: Standard AWS API throttling envelope; raisable via Service Quotas.
  - name: Q Business chat / ChatSync
    scope: application
    metric: requests_per_second
    limit: see Service Quotas console for Amazon Q Business
    notes: Per-application concurrency and TPS limits documented in Service Quotas.
  - name: Q Developer agentic requests (Free tier)
    scope: user
    metric: requests_per_month
    limit: 50
    timeFrame: month
    notes: Plan-level monthly quota; not a rate limit per second.
  - name: Q Developer agentic requests (Pro tier)
    scope: user
    metric: requests_per_month
    limit: see Q Developer pricing page
    notes: Elevated quota - exact value increases over time; check console.
  - name: Code-transformation lines (Pro)
    scope: account
    metric: lines_per_month
    limit: 4000
    timeFrame: month
    notes: Pooled across all Pro users in the account; overage at $0.003/LOC.
policies:
  - name: Backoff with jitter
    description: AWS SDKs default to standard retry mode (truncated exponential backoff with jitter, max
      20s, 3 attempts).
  - name: Plan vs throttle quotas
    description: Per-user agentic-request limits behave as monthly quotas; exceeding triggers a quota error
      rather than throttling.
  - name: Quota increases
    description: Account-level API throttle limits are raisable via Service Quotas or AWS Support.
maintainers:
  - name: Kin Lane
    email: kin@apievangelist.com
    url: https://apievangelist.com
  - name: Amazon Web Services
    email: support@aws.amazon.com
    url: https://aws.amazon.com
